name: Release

# Ein Tag wie v1.2.0 (z. B. per ./release.sh) prüft den Stand und veröffentlicht
# dann ein GitHub-Release. Der Pi rollt das neueste Release innerhalb einer Minute aus.
on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes --title "${{ github.ref_name }}"
