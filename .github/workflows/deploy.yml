name: Deploy auf den Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # läuft auf dem GitHub-Runner, der auf dem Raspberry Pi installiert ist
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Website bauen und neu starten
        run: bash holiday.sh deploy

      - name: Prüfen, ob die Website antwortet
        run: |
          sleep 2
          curl -fsS "http://localhost:${PORT:-8080}" > /dev/null
          echo "Website ist online ✔"
