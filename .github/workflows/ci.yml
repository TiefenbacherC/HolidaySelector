name: CI

# Prüft bei jedem Push, ob die Website baut und funktioniert.
# Ausgerollt wird nur, was als Release veröffentlicht ist (siehe release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skripte prüfen
        run: bash -n holiday.sh && bash -n pi-setup.sh && bash -n release.sh

      - name: JavaScript prüfen
        run: for f in server.js site/*.js; do node --check "$f"; done

      - name: Docker-Image bauen und testen
        run: |
          docker build --build-arg VERSION=ci -t holiday-selector .
          docker run -d --name test -p 8080:8080 holiday-selector
          sleep 2
          curl -fsS http://localhost:8080/ | grep -q "Unser nächster Urlaub"
          curl -fsS http://localhost:8080/result | grep -q "Auswertung"
          post() { curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d "$1" http://localhost:8080/api/choice; }
          test "$(post '{"mode":"choose","destination":"Lanzarote"}')" = 201
          # nur eine Auswahl erlaubt
          test "$(post '{"mode":"surprise"}')" = 409
          curl -fsS http://localhost:8080/api/choice | grep -q '"destination":"Lanzarote"'
          # nach dem Zurücksetzen kann neu gewählt werden
          curl -fsS -X DELETE http://localhost:8080/api/choice
          curl -fsS http://localhost:8080/api/choice | grep -q '"choice":null'
          test "$(post '{"mode":"surprise"}')" = 201
          echo "Website, Auswahl-Sperre und Auswertung funktionieren ✔"

      - name: Logs bei Fehler
        if: failure()
        run: docker logs test || true
